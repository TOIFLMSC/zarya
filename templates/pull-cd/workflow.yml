name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Replace the demo's commands with the project's actual checks and build.
      - name: Verify and build service
        run: |
          python3 -m py_compile deploy/pull-cd/demo/app.py deploy/pull-cd/demo/adapter.py
          mkdir -p dist/release
          cp deploy/pull-cd/demo/app.py dist/release/
          printf '1\n' > dist/release/VERSION
          python3 deploy/pull-cd/bundle.py dist/release "$GITHUB_SHA"
      - name: Publish verified release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
