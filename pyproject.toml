[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zarya"
version = "0.1.0"
description = "Local control panel for the Zarya Telegram companion"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "aiosqlite>=0.21,<1",
  "filelock>=3.18,<4",
  "aiogram>=3.31,<4",
  "openai>=3.26,<4",
  "pillow>=11,<13",
  "aiohttp>=3.13,<4",
]

[project.scripts]
zarya = "zarya.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/zarya"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/zarya"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
