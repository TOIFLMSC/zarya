name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Zarya
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install tooling and locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked
          npm install --global pnpm@11.19.0
          pnpm --dir web install --frozen-lockfile
      - name: Install and verify FFmpeg for media tests
        timeout-minutes: 4
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
            sudo sed -i -E \
              -e 's|https?://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://security[.]ubuntu[.]com/ubuntu|https://security.ubuntu.com/ubuntu|g' \
              "$ubuntu_sources"
            apt_options=(
              -o "Dir::Etc::SourceList=$ubuntu_sources"
              -o Dir::Etc::SourceParts=/dev/null
              -o Acquire::Retries=1
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
            )
            sudo apt-get "${apt_options[@]}" update --error-on=any
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Check publication, Python and frontend
        run: |
          uv run --no-sync python scripts/check-publication.py
          uv run --no-sync ruff check src tests scripts deploy
          sh -n deploy/install.sh
          uv run --no-sync mypy
          uv run --no-sync mypy --platform win32
          pnpm --dir web run build
      - name: Upgrade a synthetic database from the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --no-sync python scripts/check-upgrade.py "$BASE_SHA"
      - name: Run tests
        run: uv run --no-sync pytest -q
      - name: Build and verify the release bundle
        run: |
          mkdir -p dist/release
          uv run --no-sync python -m zarya.memory_e5
          uv build --wheel --out-dir "$RUNNER_TEMP/zarya-wheel"
          cp "$RUNNER_TEMP/zarya-wheel/"*.whl dist/release/
          uv export --locked --no-dev --no-emit-project --format requirements.txt -o dist/release/requirements.txt
          cp -r web/dist dist/release/web
          echo "$GITHUB_SHA" > dist/release/REVISION
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path, = Path("dist/release").glob("*.whl")
          with ZipFile(path) as wheel:
              assert {
                  "zarya/e5_assets/tokenizer.json",
                  "zarya/e5_assets/model_quantized.onnx",
                  "zarya/e5_license.txt",
              } <= set(wheel.namelist())
          assert sum(p.stat().st_size for p in path.parent.rglob("*") if p.is_file()) < 256 * 1024**2
          PY
          cd dist/release
          # upload-artifact skips hidden paths. Every file in the manifest must ship.
          if [[ -n "$(find . -mindepth 1 -name '.*' -print -quit)" ]]; then
            echo 'Release contains a hidden path that upload-artifact would omit' >&2
            exit 1
          fi
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Exercise installer, systemd timer and promotion on this disposable runner
        env:
          HOST_TYPE: ${{ runner.environment }}
        run: sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$HOST_TYPE" sh deploy/check-systemd.sh
      - name: Store the main release bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zarya-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
