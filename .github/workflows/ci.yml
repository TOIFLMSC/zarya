name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Zarya
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install tooling and locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked
          npm install --global pnpm@11.19.0
          pnpm --dir web install --frozen-lockfile
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Check publication, Python and frontend
        run: |
          uv run --no-sync python scripts/check-publication.py
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync mypy
          pnpm --dir web run build
      - name: Upgrade a synthetic database from the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --no-sync python scripts/check-upgrade.py "$BASE_SHA"
      - name: Run tests
        run: uv run --no-sync pytest -q
      - name: Build and verify the release bundle
        run: |
          mkdir -p dist/release
          uv build --wheel --out-dir dist/release
          uv export --locked --no-dev --no-emit-project --format requirements.txt -o dist/release/requirements.txt
          cp -r web/dist dist/release/web
          echo "$GITHUB_SHA" > dist/release/REVISION
          cd dist/release
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Store the main release bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zarya-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
